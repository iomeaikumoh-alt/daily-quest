openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: ai
    description: AI parsing and goal breakdown (Claude, with rule-based mock fallback)
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /parse:
    post:
      operationId: parseNaturalLanguage
      tags: [ai]
      summary: Parse natural language into quest items
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ParseRequest"
      responses:
        "200":
          description: Parsed quest items
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParseResult"
        "400":
          description: Missing or invalid input text
        "429":
          description: Too many requests
  /breakdown:
    post:
      operationId: breakdownGoal
      tags: [ai]
      summary: Break a big goal down into dated subtasks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BreakdownRequest"
      responses:
        "200":
          description: Goal breakdown
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BreakdownResult"
        "400":
          description: Missing or invalid goal
        "429":
          description: Too many requests
  /resplit:
    post:
      operationId: resplitTask
      tags: [ai]
      summary: Split one task into smaller subtasks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResplitRequest"
      responses:
        "200":
          description: Task split into smaller subtasks
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BreakdownResult"
        "400":
          description: Missing or invalid title
        "429":
          description: Too many requests
components:
  schemas:
    ParseRequest:
      type: object
      properties:
        text:
          type: string
        now:
          type: string
          format: date-time
      required:
        - text
    ParseResult:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ParseItem"
        source:
          $ref: "#/components/schemas/AISource"
        model:
          type: [string, "null"]
        fallbackReason:
          type: [string, "null"]
      required:
        - items
    AISource:
      type: string
      enum: [claude, mock]
    BreakdownRequest:
      type: object
      properties:
        goal:
          type: string
        deadline:
          type: [string, "null"]
        now:
          type: string
          format: date-time
      required:
        - goal
    ResplitRequest:
      type: object
      properties:
        title:
          type: string
        now:
          type: string
          format: date-time
      required:
        - title
    BreakdownResult:
      type: object
      properties:
        goalTitle:
          type: string
        deadline:
          type: string
        assumption:
          type: [string, "null"]
        subtasks:
          type: array
          items:
            $ref: "#/components/schemas/BreakdownSubtask"
        source:
          $ref: "#/components/schemas/AISource"
        model:
          type: [string, "null"]
        fallbackReason:
          type: [string, "null"]
      required:
        - goalTitle
        - deadline
        - assumption
        - subtasks
    BreakdownSubtask:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        doneWhen:
          type: string
        durationMin:
          type: integer
        difficulty:
          type: integer
          minimum: 1
          maximum: 5
        dayOffset:
          type: integer
          minimum: 0
        dependsOn:
          type: array
          items:
            type: string
        starterStep:
          type: string
      required:
        - id
        - title
        - doneWhen
        - durationMin
        - difficulty
        - dayOffset
        - dependsOn
        - starterStep
    ParseItem:
      type: object
      properties:
        kind:
          type: string
          enum: [task, bigGoal]
        title:
          type: string
        date:
          type: [string, "null"]
        startTime:
          type: [string, "null"]
        durationMin:
          type: integer
        location:
          type: [string, "null"]
        note:
          type: [string, "null"]
        difficulty:
          type: integer
          minimum: 1
          maximum: 5
        recurrence:
          $ref: "#/components/schemas/ParseRecurrence"
        uncertain:
          type: array
          items:
            type: string
      required:
        - kind
        - title
        - date
        - startTime
        - durationMin
        - location
        - note
        - difficulty
        - recurrence
        - uncertain
    ParseRecurrence:
      type: object
      properties:
        freq:
          type: string
          enum: [none, daily, weekly]
        byWeekday:
          type: array
          items:
            type: integer
            minimum: 0
            maximum: 6
        until:
          type: [string, "null"]
      required:
        - freq
        - byWeekday
        - until
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

